<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14213D">
<title>Live screen: Agent Browser</title>
<link rel="preload" href="/static/fonts/ahn-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/ui.css">
<style>
body{min-height:100vh}
.band{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:6px solid var(--edge,var(--rule));padding:10px 14px 10px}
@media (prefers-color-scheme:dark){.band{background:#05090F}}
.band .l1{display:flex;align-items:center;gap:10px}
.band a.back{color:#fff;font-weight:600;min-height:40px;display:inline-flex;align-items:center;padding-right:6px}
.band .stw{font-weight:750;font-size:1.0625rem}
.band .msg{font-size:.9375rem;color:#D5DCE6;margin-top:2px;overflow-wrap:anywhere}
.band .url{font-size:.75rem;color:#AEB9C8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{display:grid;gap:0}
@media (min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 400px;align-items:start}.col{height:calc(100vh - 92px);overflow:auto;position:sticky;top:92px;border-left:1px solid var(--rule)}}
#stage{position:relative;width:100%;background:#000;touch-action:none;overflow:hidden}
#vp{position:absolute;inset:0;transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){#vp{transition:transform .35s}}
#ask{scroll-margin-top:120px}
#screen{width:100%;height:100%}
.noscreen{color:#cbd5e1;padding:24px;margin:0}
#touch{position:absolute;inset:0;z-index:5;touch-action:none;cursor:crosshair}
#lock{position:absolute;left:8px;bottom:8px;z-index:6;background:rgba(10,16,28,.82);color:#fff;padding:6px 10px;border-radius:8px;font-size:.8125rem;font-weight:600;max-width:calc(100% - 16px)}
#hl{position:absolute;z-index:4;border:3px solid var(--marigold);border-radius:6px;pointer-events:none;display:none}
#fhl{position:absolute;z-index:4;border:3px solid #7EA2F2;border-radius:6px;pointer-events:none;display:none}
.dot{position:absolute;z-index:4;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #7EA2F2;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:d .9s forwards}@keyframes d{to{transform:scale(2.2);opacity:0}}}
.col{padding:12px 14px 120px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls .primary,.controls .ask{flex:1 1 150px}
.controls .danger{margin-left:auto}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tools button{min-height:40px;padding:6px 12px;font-size:.875rem;border-color:var(--rule)}
.tools button[aria-pressed=true]{border-color:var(--ink);background:var(--sheet)}
.tell{display:flex;gap:8px;margin-top:12px}
.panel{margin-top:12px;display:none;gap:8px}
.panel.on{display:flex}
h2.sec{font-size:1.0625rem;margin:22px 0 6px}
#stream{list-style:none;margin:0;padding:0;font-size:.875rem}
#stream li{padding:6px 0 6px 12px;border-left:3px solid var(--rule);margin:0;overflow-wrap:anywhere}
#stream .tm{color:var(--muted);font-size:.75rem;margin-right:6px;font-variant-numeric:tabular-nums}
#stream .k-think{border-color:#8B7BD8}#stream .k-act,#stream .k-click,#stream .k-type,#stream .k-scroll{border-color:var(--run)}
#stream .k-result,#stream .k-snapshot,#stream .k-log{color:var(--muted)}
#stream .k-blocked,#stream .k-paused,#stream .k-needs_input{border-color:var(--marigold);font-weight:600}
#stream .k-resumed,#stream .k-file,#stream .k-download{border-color:var(--leaf)}
#stream .k-user{border-color:var(--ink)}#stream .k-stopped{border-color:var(--brick)}
#stream.quiet .k-snapshot,#stream.quiet .k-log,#stream.quiet .k-result{display:none}
.answer{margin-top:12px;padding:10px 12px;background:var(--leaf-wash);border-radius:10px;overflow-wrap:anywhere}
.takehint{margin-top:12px;padding:10px 12px;background:var(--marigold-wash);border-radius:10px;font-size:.9375rem}
/* typing overlay: sits above the phone keyboard */
#typer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);border-top:3px solid var(--run);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:none;box-shadow:0 -12px 30px -18px rgba(20,33,61,.6)}
#typer.on{display:block}
#typer .lab{font-weight:600;font-size:.9375rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
#typer .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#typer .line{display:flex;gap:8px;margin-top:6px}
#typer .st{font-size:.75rem;color:var(--muted);margin-top:4px;min-height:1em}
#typer .opts{display:grid;gap:6px;max-height:42vh;overflow:auto;margin-top:6px}
#typer .opts button{justify-content:flex-start;border-color:var(--rule);min-height:44px}
#typer .opts button[aria-current=true]{border-color:var(--ink);font-weight:750}
</style></head>
<body>
<header class="band" id="band">
  <div class="l1"><a class="back" href="/" aria-label="Back to tasks">Tasks</a><span class="stw" id="stw" role="status">Connecting…</span></div>
  <p class="msg" id="msg"></p>
  <p class="url" id="url"></p>
</header>
<div class="wrap">
  <div>
    <div id="stage" aria-label="Live screen of the cloud browser"><div id="vp"><div id="screen"></div><div id="hl"></div><div id="fhl"></div></div><div id="touch"></div><div id="lock">Watching</div></div>
  </div>
  <div class="col">
    <div id="ask"></div>
    <div id="hint"></div>
    <div class="controls">
      <button class="primary" id="pause">Pause and take over</button>
      <button class="ask" id="resume" hidden>Resume agent</button>
      <button class="danger" id="stop">Stop</button>
    </div>
    <div class="tools">
      <button id="kbtn" aria-pressed="false">Keyboard</button>
      <button id="zoom" aria-pressed="true">Follow the agent</button>
      <button id="gobtn" aria-pressed="false">Open a web address</button>
    </div>
    <div class="panel" id="kb"><label class="sr" for="txt">Text to type</label><input id="txt" class="grow" placeholder="Type, then Send" autocomplete="off" autocapitalize="off">
      <button id="send">Send</button><button data-k="Return" class="quiet">Enter</button><button data-k="BackSpace" class="quiet" aria-label="Backspace">Delete</button><button data-k="Tab" class="quiet">Tab</button></div>
    <div class="panel" id="gobar"><label class="sr" for="gourl">Web address</label><input id="gourl" class="grow" placeholder="chromewebstore.google.com" inputmode="url" autocomplete="off"><button id="gogo">Open</button></div>
    <div class="tell" id="tellrow"><label class="sr" for="gtxt">Tell the agent</label><input id="gtxt" class="grow" placeholder="Tell the agent how to go on" autocomplete="off"><button id="gsend">Send</button></div>
    <div class="tell" id="noterow" hidden><label class="sr" for="note">Note for the agent</label><input id="note" class="grow" placeholder="Optional note for when it resumes" autocomplete="off"></div>
    <div id="answer"></div>
    <section id="files" hidden><h2 class="sec">Files</h2><div id="filelist"></div></section>
    <div class="row" style="justify-content:space-between;margin-top:22px"><h2 class="sec" style="margin:0">Activity</h2>
      <label class="small row" style="gap:6px"><input type="checkbox" id="detail" style="width:auto;min-height:0"> Show all details</label></div>
    <ol id="stream" class="quiet" aria-live="off"></ol>
    <p class="small muted" style="margin-top:12px">Tap the screen to click and drag to scroll, once you have control. The agent never solves captchas.</p>
  </div>
</div>
<div id="typer" role="dialog" aria-label="Type into the page">
  <div class="lab"><span id="tlab">Field</span><button class="small quiet" id="tdone">Done</button></div>
  <div class="line" id="tline"><label class="sr" for="tin">Text for the field</label><input id="tin" class="grow" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <button class="small" id="tenter">Enter</button></div>
  <div class="opts" id="topts" hidden></div>
  <p class="st" id="tst"></p>
</div>
<script src="/static/ui.js"></script>
<script type="module">
let RFB = null;
try { RFB = (await import('/novnc/core/rfb.js')).default; } catch (e) { console.warn('live screen unavailable', e); }
const $ = s => document.querySelector(s);
const {esc, post, STATE, live, askHTML, wireAsk, keepAsks, filesHTML, wireFiles} = UI;
let taskId = (location.pathname.split('/')[2] || ''), screen = [1366, 900], rfb, status = null, curBox = null, zoomOn = true, after = -1, canDrive = false;
let fieldRects = [], typing = null, lastAskKey = '', lastFilesKey = '';

function fit() { const w = $('#stage').clientWidth; $('#stage').style.height = Math.round(w * screen[1] / screen[0]) + 'px'; placeHL(); }
function connect() {
  if (!RFB) { $('#screen').innerHTML = '<p class="noscreen">The live screen could not load. Controls still work.</p>'; return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  rfb = new RFB($('#screen'), `${proto}://${location.host}/vnc`, {}); rfb.viewOnly = true; rfb.scaleViewport = true; rfb.background = '#000';
  rfb.addEventListener('disconnect', () => setTimeout(connect, 1500));
}
function applyZoom() {
  const vp = $('#vp'), W = $('#stage').clientWidth, H = $('#stage').clientHeight, s0 = W / screen[0];
  if (!zoomOn || !curBox) { vp.style.transform = 'none'; return; }
  const z = Math.max(1, Math.min(3.2, W / ((curBox[2] + 120) * s0)));
  let tx = W / 2 - (curBox[0] + curBox[2] / 2) * s0 * z, ty = H / 2 - (curBox[1] + curBox[3] / 2) * s0 * z;
  tx = Math.min(0, Math.max(W - W * z, tx)); ty = Math.min(0, Math.max(H - H * z, ty));
  vp.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
}
function placeHL() {
  const hl = $('#hl'); applyZoom();
  if (!curBox) { hl.style.display = 'none'; return; }
  const s = $('#stage').clientWidth / screen[0];
  Object.assign(hl.style, {display: 'block', left: (curBox[0] * s - 6) + 'px', top: (curBox[1] * s - 6) + 'px', width: (curBox[2] * s + 12) + 'px', height: (curBox[3] * s + 12) + 'px'});
}
function showField(box) {
  const f = $('#fhl'), s = $('#stage').clientWidth / screen[0];
  if (!box) { f.style.display = 'none'; return; }
  Object.assign(f.style, {display: 'block', left: (box[0] * s - 4) + 'px', top: (box[1] * s - 4) + 'px', width: (box[2] * s + 8) + 'px', height: (box[3] * s + 8) + 'px'});
}
function agentDot(x, y) { const s = $('#stage').clientWidth / screen[0]; const d = document.createElement('div'); d.className = 'dot';
  d.style.left = (x * s) + 'px'; d.style.top = (y * s) + 'px'; $('#vp').appendChild(d); setTimeout(() => d.remove(), 950); }

const EDGE = {running: 'var(--run)', queued: 'var(--run)', needs_input: 'var(--marigold)', needs_you: 'var(--marigold)', paused: '#7EA2F2', done: 'var(--leaf)', failed: 'var(--brick)', stopped: 'var(--brick)', cancelled: 'var(--brick)'};
function setUI(t) {
  status = t ? t.status : null;
  const takeover = !!(t && t.input_req && t.input_req.takeover);
  const waitingYou = status === 'needs_you' || status === 'paused';
  canDrive = !t || !['running', 'queued'].includes(status);
  $('#band').style.setProperty('--edge', EDGE[status] || 'var(--rule)');
  $('#pause').hidden = !(status === 'running' || status === 'queued');
  $('#resume').hidden = !waitingYou;
  $('#resume').textContent = takeover ? 'Done, continue' : 'Resume agent';
  $('#stop').hidden = !t || !live(status);
  $('#noterow').hidden = !(waitingYou && !takeover);
  $('#tellrow').hidden = !t || !live(status) || status === 'needs_input';
  $('#lock').textContent = canDrive ? (t ? 'You have control. Tap a field to type into it.' : 'No task running. You can use the browser.') : 'Watching. Pause to take over.';
  // ask sheet: re-render only when the request changes, so typing is never wiped
  const key = t && t.input_req ? t.input_req.id + (t.input_req.takeover ? 't' : '') : '';
  if (key !== lastAskKey) {
    lastAskKey = key;
    keepAsks($('#ask'), () => { $('#ask').innerHTML = t && t.input_req && !t.input_req.takeover ? askHTML(t) : ''; });
    wireAsk($('#ask'), () => setTimeout(poll1, 200));
    if (key && !takeover) { $('#ask').scrollIntoView({block: 'start'}); }
  }
  $('#hint').innerHTML = takeover ? '<p class="takehint">Tap a field on the screen and type. Tap Done, continue when the page is filled in.</p>' : '';
  const fk = t ? JSON.stringify(t.files || []) : '';
  if (fk !== lastFilesKey) { lastFilesKey = fk; $('#files').hidden = !(t && t.files && t.files.length);
    $('#filelist').innerHTML = t ? filesHTML(t.id, t.files) : ''; if (location.hash === '#files' && t && t.files.length) $('#files').scrollIntoView(); }
  $('#answer').innerHTML = t && t.answer ? `<div class="answer">${esc(t.answer)}</div>` : t && t.error ? `<div class="answer" style="background:var(--brick-wash)">${esc(t.error)}</div>` : '';
  const b = t && t.blocker;
  if (b) { screen = b.screen || screen; curBox = b.screen_box; fit(); $('#stw').textContent = 'Blocked: ' + b.label; $('#msg').textContent = b.needs; $('#url').textContent = b.url; return; }
  curBox = null; placeHL();
  if (!t) { $('#stw').textContent = 'No task running'; $('#msg').textContent = 'This is the cloud browser. You can drive it freely.'; $('#url').textContent = ''; return; }
  $('#stw').textContent = takeover ? 'You are filling it in' : (status === 'needs_input' && t.input_req && t.input_req.kind === 'confirm') ? 'Check before it submits' : (STATE[status] || status);
  $('#msg').textContent = status === 'needs_input' && t.input_req ? t.input_req.reason : status === 'paused' ? 'Do what you need, then resume. The agent carries on from where you leave the page.' : t.goal;
  $('#url').textContent = t.url || '';
}

async function poll1() {
  try {
    let t = null;
    if (!taskId) { const d = await (await fetch('/api/tasks')).json(); taskId = d.current || (d.tasks[0] && d.tasks[0].id) || '';
      if (taskId && location.pathname === '/live') history.replaceState(null, '', '/live/' + taskId + location.hash); }
    if (taskId) {
      t = await (await fetch('/api/tasks/' + taskId)).json();
      const ev = await (await fetch(`/api/tasks/${taskId}/events?after=${after}`)).json();
      const ol = $('#stream');
      for (const e of ev.events) {
        after = e.seq; const li = document.createElement('li'); li.className = 'k-' + e.kind;
        li.innerHTML = `<span class="tm">${new Date(e.t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})}</span>${esc(e.text)}`;
        ol.prepend(li);
        if (e.kind === 'click' && e.x != null && Date.now() / 1000 - e.t < 5) agentDot(e.x, e.y);
      }
      while (ol.children.length > 400) ol.lastChild.remove();
    }
    const was = canDrive;
    setUI(t);
    if (canDrive && !was) refreshFields();
  } catch (e) {}
}
async function poll() { await poll1(); setTimeout(poll, 1000); }

// ---------- your input while you have control ----------
let st = null;
const toScreen = (cx, cy) => { const r = $('#vp').getBoundingClientRect(); return [Math.round((cx - r.left) * screen[0] / r.width), Math.round((cy - r.top) * screen[1] / r.height)]; };
const send = async ev => { const r = await post('/api/input', ev); if (r.status === 409) $('#lock').textContent = 'Pause first to take over.'; return r; };
let fieldsTimer = null;
function refreshFields() { clearTimeout(fieldsTimer); fieldsTimer = setTimeout(async () => {
  if (!canDrive) { fieldRects = []; return; }
  try { fieldRects = (await (await fetch('/api/fields')).json()).fields || []; } catch (e) { fieldRects = []; } }, 500); }
setInterval(() => { if (canDrive && !typing) refreshFields(); }, 5000);
const hit = (x, y) => fieldRects.find(f => x >= f.box[0] - 4 && x <= f.box[0] + f.box[2] + 4 && y >= f.box[1] - 4 && y <= f.box[1] + f.box[3] + 4);

$('#touch').addEventListener('pointerdown', e => { st = {x: e.clientX, y: e.clientY, ly: e.clientY, moved: false}; e.preventDefault(); });
$('#touch').addEventListener('pointermove', e => {
  if (!st) return; const dy = st.ly - e.clientY;
  if (Math.abs(e.clientY - st.y) > 10 || Math.abs(e.clientX - st.x) > 10) st.moved = true;
  if (st.moved && canDrive && Math.abs(dy) >= 40) { const [x, y] = toScreen(e.clientX, e.clientY);
    send({type: 'scroll', x, y, ticks: Math.sign(dy) * Math.min(4, Math.floor(Math.abs(dy) / 40))}); st.ly = e.clientY; closeTyper(); refreshFields(); }
});
$('#touch').addEventListener('pointerup', async e => {
  if (!st) return; const moved = st.moved; st = null;
  if (moved) return;
  if (!canDrive) { $('#lock').textContent = 'Pause first to take over.'; return; }
  const [x, y] = toScreen(e.clientX, e.clientY);
  const f = hit(x, y);
  // open the keyboard inside this tap (phones only allow focus during a gesture), then confirm with the server
  if (f && f.kind === 'text') openTyper({label: f.label, editable: true, kind: 'text', value: ''}, f.box, true);
  flash(e);
  const r = await send({type: 'tap', x, y});
  let j = {}; try { j = await r.json(); } catch (err) {}
  const fld = j.field;
  if (fld && (fld.editable || fld.kind === 'select')) openTyper(fld, f && f.box, false);
  else if (typing) closeTyper();
  refreshFields();
});
function flash(e) { const d = document.createElement('div'); const r = $('#stage').getBoundingClientRect();
  Object.assign(d.style, {position: 'absolute', left: (e.clientX - r.left - 14) + 'px', top: (e.clientY - r.top - 14) + 'px', width: '28px', height: '28px', borderRadius: '50%', border: '2px solid #7EA2F2', zIndex: 6, pointerEvents: 'none'});
  $('#stage').appendChild(d); setTimeout(() => d.remove(), 350); }

// typing overlay: whatever you type is mirrored into the tapped field (debounced, whole value each time)
let sendTimer = null, sentVal = null;
function openTyper(fld, box, early) {
  const tin = $('#tin');
  typing = fld;
  $('#typer').classList.add('on');
  $('#tlab').textContent = fld.label ? `Typing into: ${fld.label}` : 'Typing into the field you tapped';
  showField(box || null);
  if (fld.kind === 'select') {
    $('#tline').hidden = true; const o = $('#topts'); o.hidden = false;
    const opts = (fld.options || []).filter(x => !x.disabled);
    o.innerHTML = opts.map((x, i) => `<button data-i="${i}" ${x.text === fld.value ? 'aria-current="true"' : ''}>${esc(x.text || '(blank)')}</button>`).join('');
    o.dataset.count = opts.length; $('#tst').textContent = 'Pick an option.'; o.querySelector('button')?.focus();
    return;
  }
  $('#tline').hidden = false; $('#topts').hidden = true;
  const num = ['numeric', 'decimal', 'tel'].includes(fld.inputmode) || ['number', 'tel'].includes(fld.type);
  tin.type = fld.type === 'password' ? 'password' : fld.type === 'email' ? 'email' : 'text';
  tin.inputMode = fld.type === 'email' ? 'email' : fld.type === 'tel' ? 'tel' : num ? 'numeric' : 'text';
  tin.classList.toggle('value', num);
  if (fld.maxlength) tin.maxLength = +fld.maxlength; else tin.removeAttribute('maxlength');
  if (early) { tin.value = ''; sentVal = null; tin.focus(); $('#tst').textContent = 'Checking the field…'; }
  else {
    if (document.activeElement !== tin || !tin.value) { tin.value = fld.value || ''; sentVal = tin.value; }
    if (document.activeElement !== tin) tin.focus();
    $('#tst').textContent = 'What you type goes straight into the page.';
  }
}
function closeTyper() { flushType(); typing = null; $('#typer').classList.remove('on'); showField(null); $('#tin').blur(); }
async function flushType() {
  clearTimeout(sendTimer);
  const v = $('#tin').value;
  if (!typing || typing.kind === 'select' || v === sentVal) return;
  sentVal = v;
  const r = await send({type: 'set_text', text: v});
  let j = {}; try { j = await r.json(); } catch (e) {}
  $('#tst').textContent = j.ok ? 'Typed into the page.' : (j.why || 'That did not reach the page. Tap the field again.');
}
$('#tin').addEventListener('input', () => { clearTimeout(sendTimer); $('#tst').textContent = 'Typing…'; sendTimer = setTimeout(flushType, 350); });
$('#tin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); flushType().then(closeTyper); } });
$('#tenter').onclick = async () => { await flushType(); await send({type: 'key', key: 'Return'}); closeTyper(); };
$('#tdone').onclick = closeTyper;
$('#topts').addEventListener('click', async e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const r = await send({type: 'select', index: +b.dataset.i, count: +$('#topts').dataset.count});
  let j = {}; try { j = await r.json(); } catch (err) {}
  $('#tst').textContent = j.ok ? `Picked ${j.value || b.textContent}.` : (j.why || 'That did not reach the page.');
  if (j.ok) setTimeout(closeTyper, 400);
});
if (window.visualViewport) visualViewport.addEventListener('resize', () => {
  const off = window.innerHeight - visualViewport.height - visualViewport.offsetTop;
  $('#typer').style.bottom = Math.max(0, off) + 'px';
});

// ---------- controls ----------
const toggle = (btn, panel, focusEl) => { const on = !$(panel).classList.contains('on'); $(panel).classList.toggle('on', on); $(btn).setAttribute('aria-pressed', on); if (on && focusEl) $(focusEl).focus(); };
$('#kbtn').onclick = () => toggle('#kbtn', '#kb', '#txt');
$('#gobtn').onclick = () => toggle('#gobtn', '#gobar', '#gourl');
$('#send').onclick = () => { const v = $('#txt').value; if (v) { send({type: 'text', text: v}); $('#txt').value = ''; } };
$('#txt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#send').click(); } });
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => send({type: 'key', key: b.dataset.k}));
$('#gogo').onclick = async () => { const u = $('#gourl').value.trim(); if (!u) return;
  const r = await send({type: 'goto', url: u}); if (r.ok) { toggle('#gobtn', '#gobar'); $('#gourl').value = ''; } };
$('#pause').onclick = async () => { if (taskId) { await post(`/api/tasks/${taskId}/pause`); $('#stw').textContent = 'Pausing after the current action…'; } };
async function sendGuide() { const v = $('#gtxt').value.trim(); if (!v || !taskId) return; $('#gtxt').value = ''; await post(`/api/tasks/${taskId}/guide`, {text: v}); }
$('#gsend').onclick = sendGuide; $('#gtxt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendGuide(); } });
$('#resume').onclick = async () => { if (!taskId) return; closeTyper(); await post(`/api/tasks/${taskId}/resume`, {note: $('#note').value}); $('#note').value = ''; $('#stw').textContent = 'Resuming…'; };
$('#stop').onclick = async () => { if (taskId && confirm('Stop this task?')) await post(`/api/tasks/${taskId}/stop`); };
$('#zoom').onclick = () => { zoomOn = !zoomOn; $('#zoom').setAttribute('aria-pressed', zoomOn); placeHL(); };
$('#detail').onchange = e => $('#stream').classList.toggle('quiet', !e.target.checked);
wireFiles($('#filelist'), () => { lastFilesKey = ''; poll1(); });
window.addEventListener('resize', fit); fit(); connect(); poll();
</script>
</body></html>
